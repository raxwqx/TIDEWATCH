version = 1

[[rules]]
id = "SSH-001"
name = "SSH authentication failure burst"
description = "Several SSH authentication failures from one source IP occurred inside a short window. Check whether the attempts are expected and whether a later login succeeded."
severity = "high"
condition = "threshold"
event_kinds = ["ssh_auth_failure"]
threshold = 8
window_seconds = 300
group_by = "source_ip"
mitre = ["T1110.001"]
enabled = true

[[rules]]
id = "SSH-002"
name = "SSH success after repeated authentication failures"
description = "A successful SSH login followed repeated failures from the same source IP within the configured window. Treat this as a triage pivot, not proof that credentials were compromised."
severity = "critical"
condition = "failure_then_success"
event_kinds = ["ssh_auth_failure"]
success_event_kinds = ["ssh_auth_success", "ssh_root_login"]
threshold = 5
window_seconds = 600
group_by = "source_ip"
mitre = ["T1110", "T1078"]
enabled = true

[[rules]]
id = "SSH-003"
name = "Remote root SSH login observed"
description = "An SSH authentication success for the root account was present in the input. Confirm that direct root access is permitted by policy and expected for this host."
severity = "high"
condition = "threshold"
event_kinds = ["ssh_root_login"]
threshold = 1
window_seconds = 60
group_by = "source_ip"
mitre = ["T1021.004", "T1078.003"]
enabled = true

[[rules]]
id = "SSH-004"
name = "Invalid SSH username probing"
description = "Several invalid-user notices came from one source IP. Correlate with authentication failures and perimeter logs to distinguish scanning noise from targeted activity."
severity = "medium"
condition = "threshold"
event_kinds = ["ssh_invalid_user"]
threshold = 5
window_seconds = 300
group_by = "source_ip"
mitre = ["T1110.001"]
enabled = true

[[rules]]
id = "ACCOUNT-001"
name = "Local account creation observed"
description = "A local account-creation event was found. Verify the change against an approved request and the host's account-management records."
severity = "medium"
condition = "threshold"
event_kinds = ["user_added"]
threshold = 1
window_seconds = 60
group_by = "user"
mitre = ["T1136.001"]
enabled = true

[[rules]]
id = "PRIV-001"
name = "Repeated sudo command activity"
description = "A burst of sudo command records was observed for one user. Review the commands and change context; legitimate administration can produce the same pattern."
severity = "medium"
condition = "threshold"
event_kinds = ["sudo_command"]
threshold = 10
window_seconds = 300
group_by = "user"
mitre = ["T1548.003"]
enabled = true

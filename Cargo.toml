[package]
name = "tidewatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline Linux log threat-hunting and incident triage engine"
license = "MIT"
repository = "https://github.com/raxwqx/TIDEWATCH"
readme = "README.md"
keywords = ["security", "threat-hunting", "forensics", "linux", "incident-response"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1
